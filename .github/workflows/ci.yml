name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # vite-plus 0.1.x does not manage the package manager (0.3.1 and later do), so a
      # bare runner has no pnpm for `vp install` to call. This reads packageManager
      # from package.json and puts that pnpm on PATH first.
      - uses: pnpm/action-setup@v6
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: "24"
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run verify
      # The per-verb rows of AGENTS.md, against an anonymous local backend this starts
      # and deletes itself: no Convex account and no secret. The first run on a runner
      # downloads the backend binary before the deployment answers.
      - run: vp run verify:e2e
